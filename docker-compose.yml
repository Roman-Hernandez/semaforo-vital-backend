services:
  redis:
    image: redis:7.4-alpine
    container_name: semaforo-vital-redis
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: semaforo-vital-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy